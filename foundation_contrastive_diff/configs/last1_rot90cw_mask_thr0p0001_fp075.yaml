dataset_root: /cs/labs/josko/sahar_aharon/fcd_train
cache_dir: /cs/labs/josko/sahar_aharon/fcd_cache_last1_rot90cw_inference
save_folder: /cs/labs/josko/sahar_aharon/fcd_runs/run_last1_rot90cw_mask_thr0p0001_fp075/checkpoints
plots_folder: /cs/labs/josko/sahar_aharon/fcd_runs/run_last1_rot90cw_mask_thr0p0001_fp075/plots

head: dpt_cross_attention
dpt_channels: 96
feat_last_k: 1
rotation_k: 3
seed: 42
